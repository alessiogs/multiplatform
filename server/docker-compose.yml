services:
  database:
    image: 'postgres:18'

    ports:
      - 5555:5432

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    env_file:
      - .env

    volumes:
      - ./db-data/:/var/lib/postgresql/data/
