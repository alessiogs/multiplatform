services:
  db:
    image: postgres:18
    container_name: postgres-dev
    env_file: .env
    environment:
      POSTGRES_USER: admin
      POSTGRES_DB: multiplatform_db
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - '5555:5432'
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
